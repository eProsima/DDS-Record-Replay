dds:
  domain: 0

  allowlist:
    - name: "topic_name"
    - name: "HelloWorldTopic"
      type: "HelloWorld"

  blocklist:
    - name: "topic_to_block"
      type: "type_to_block"

  builtin-topics:
    - name: "HelloWorldTopic"
      type: "HelloWorld"

  topics:
    - name: "temperature/*"
      type: "temperature/types/*"
      qos:
        max-rx-rate: 15
        downsampling: 2

  ignore-participant-flags: filter_same_process
  transport: shm
  whitelist-interfaces:
    - "127.0.0.1"

recorder:
  output:
    filename: "output"
    path: "."
    timestamp-format: "%Y-%m-%d_%H-%M-%S_%Z"
    local-timestamp: false
    safety-margin: "1GB"
  max-pending-samples: 10
  cleanup-period: 90
  buffer-size: 50
  event-window: 60
  only-with-type: false
  record-types: true
  ros2-types: false
  
  mcap:
    enable: false
    log-publish-time: false
    compression:
      algorithm: lz4
      level: slowest
      force: true
    resource-limits:
      max-file-size: "100KB"
      max-size: "300KB"
      log-rotation: false
      size-tolerance: "1MB"

  sql: 
    enable: true
    resource-limits:
      max-size: "2MB"
      log-rotation: false
      size-tolerance: "1MB"
      

remote-controller:
  enable: true
  domain: 10
  initial-state: "PAUSED"
  command-topic-name: "/ddsrecorder/command"
  status-topic-name: "/ddsrecorder/status"

specs:
  threads: 8

  qos:
    max-rx-rate: 20
    downsampling: 3
