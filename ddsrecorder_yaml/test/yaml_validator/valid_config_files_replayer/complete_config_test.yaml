dds:
  domain: 0

  xml:
    files:
      - "my_xml_profile.xml"

  replayer-profile: "replayer_profile_name"

  whitelist-interfaces:
    - "127.0.0.1"

  partitions:
    - "partition_1"

  transport: shm

  ros2-easy-mode: "127.0.0.1"

  ignore-participant-flags: filter_same_process

  allowlist:
    - name: "topic_name"
    - name: "HelloWorldTopic"
      type: "HelloWorld"

  blocklist:
    - name: "topic_to_block"
      type: "type_to_block"

  topics:
    - name: "temperature/*"
      type: "temperature/types/*"
      qos:
        max-tx-rate: 15

replayer:
  input-file: my_output_2023-04-10_10-37-50.mcap

  begin-time:
    local: true
    format: "%Y-%m-%d_%H-%M-%S"
    datetime: 2023-04-10_10-37-50
    milliseconds: 100

  end-time:
    local: true
    datetime: 2023-04-10_10-39-11
    milliseconds: 200
    nanoseconds: 50

  start-replay-time:
    local: true
    datetime: 2023-04-12_12-00-00
    milliseconds: 500

  rate: 1.4
  replay-types: true

specs:
  threads: 12
  rtps: true
  wait-all-acked-timeout: 10

  qos:
    durability: true
    reliability: true
    ownership: false
    partitions: true
    history-depth: 5
    keyed: false
    max-tx-rate: 20

  logging:
    publish:
      enable: true
      domain: 5
      topic-name: "/ddsreplayer/log"
    stdout: true
    verbosity: info
    filter:
      info: "DDSREPLAYER"
      warning: "DDSREPLAYER"
      error: "DDSREPLAYER"
