dds:
  domain: 3

  transport: udp

  ignore-participant-flags: filter_different_host

  whitelist-interfaces:
    - "192.168.1.1"
    - "127.0.0.1"

  allowlist:
    - name: "*"

  blocklist:
    - name: "topic_to_block"
      type: "type_to_block"

  builtin-topics:
    - name: "rt/parameter_events"
      type: "rcl_interfaces::msg::dds_::ParameterEvent_"
    - name: "rt/rosout"
      type: "rcl_interfaces::msg::dds_::Log_"

  topics:
    - name: "temperature/*"
      type: "temperature/types/*"
      qos:
        max-rx-rate: 15
        downsampling: 2
    - name: "image_topic"
      type: "sensor_msgs::msg::dds_::Image_"
      filter: "1"

recorder:
  output:
    filename: "topics_recording"
    path: "/tmp/recordings"

  mcap:
    enable: true
    resource-limits:
      max-file-size: "50MB"
      max-size: "500MB"
      log-rotation: true
